kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "uv sync --frozen && uv run playwright install chromium"]

[services.production.run]
args = ["uv", "run", "--project", ".", "python", "-m", "uvicorn", "accesscheck.api:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
ACCESSCHECK_DB_PATH = "artifacts/api-server/data/accesscheck.sqlite3"

[services.production.health.startup]
path = "/api/healthz"
